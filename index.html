<style>
/* Layout: columna única tipo laboratorio. Avance fijo arriba; lista de actividades; simulador de herramienta CASE (tablas, propiedades, consola, SQL y prueba). */
:root {
  --bg: #F2F8F1; --surface: #FFFFFF; --ink: #15211A; --muted: #5A6B5E; --line: #D8E5D6;
  --green: #07B708; --green-deep: #057A0A; --green-soft: #E2F6E2;
  --violet: #5B2BC4; --violet-soft: #EEE8FB; --gold: #F2B400;
  --bad: #D62828; --bad-soft: #FDE4E4; --ok: #0E8F4A; --ok-soft: #DDF5E7;
  --a-in: #2E7DD7; --a-out: #D6338A; --a-file: #0E9C94; --a-proc: #F07B00;
  --mock: #FAFAF7; --mock-ink: #2B2B2B; --mock-line: #C9C9C2; --logo-bg: transparent;
  --f-display: "Poppins", "Segoe UI", system-ui, sans-serif;
  --f-body: "Work Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1510; --surface: #18221B; --ink: #E9F1EA; --muted: #9FB2A3; --line: #2B3B2F;
  --green: #22C93A; --green-deep: #62E072; --green-soft: #1A3320; --violet: #A88BFF; --violet-soft: #2A2342;
  --bad: #FF7676; --bad-soft: #3B1C1C; --ok: #4ADE80; --ok-soft: #173524; --logo-bg: #FFFFFF; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1510; --surface: #18221B; --ink: #E9F1EA; --muted: #9FB2A3; --line: #2B3B2F;
  --green: #22C93A; --green-deep: #62E072; --green-soft: #1A3320; --violet: #A88BFF; --violet-soft: #2A2342;
  --bad: #FF7676; --bad-soft: #3B1C1C; --ok: #4ADE80; --ok-soft: #173524; --logo-bg: #FFFFFF; color-scheme: dark }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 28px; }
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; align-items: center; gap: 12px; }
.logo { width: 92px; height: auto; background: var(--logo-bg); border-radius: 10px; padding: 4px 6px; flex: none; }
.ttl { min-width: 0; }
.ttl h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(1.15rem, 4.6vw, 1.5rem); margin: 0; line-height: 1.15; color: var(--green-deep); }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.badge { font-family: var(--f-display); font-weight: 700; font-size: .78rem; background: var(--green); color: #06260A; border-radius: 999px; padding: 2px 12px; }
.badge.rec { background: var(--violet); color: #FFFFFF; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.panel h2 { font-family: var(--f-display); font-size: clamp(1.3rem, 5vw, 1.65rem); margin: 0; line-height: 1.2; text-wrap: balance; }
.lead { color: var(--muted); margin: 0; }
.rec-note { color: var(--violet); font-weight: 600; margin: 0; }
.case { background: var(--bad-soft); border-radius: 12px; padding: 12px 14px; }
.case b { color: var(--bad); font-family: var(--f-display); }
.case ul { margin: 6px 0 0; padding-left: 18px; }
.areas { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: .78rem; font-weight: 700; color: #FFFFFF; border-radius: 999px; padding: 2px 10px; font-family: var(--f-display); }
.t-in { background: var(--a-in); } .t-out { background: var(--a-out); } .t-file { background: var(--a-file); } .t-proc { background: var(--a-proc); }
.how { display: flex; align-items: center; gap: 12px; background: var(--violet-soft); border-radius: 12px; padding: 12px 14px; }
.how .lupa { font-size: 1.8rem; animation: look 2.2s ease-in-out infinite; }
@keyframes look { 0%,100% { transform: translate(0,0) rotate(0) } 33% { transform: translate(10px,-6px) rotate(10deg) } 66% { transform: translate(-6px,4px) rotate(-8deg) } }
label { font-weight: 600; font-size: .92rem; }
input[type=text] { width: 100%; font: inherit; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); }
input[type=text]:focus { outline: 3px solid var(--green-soft); border-color: var(--green); }
.btn { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; border: 0; border-radius: 14px; padding: 14px 20px; min-height: 52px; cursor: pointer; background: var(--green); color: #06260A; box-shadow: 0 4px 0 var(--green-deep); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--green-deep); }
.btn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; }
.btn:focus-visible, .hs:focus-visible { outline: 3px solid var(--violet); outline-offset: 3px; }

/* HUD */
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.hudrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.pill { font-family: var(--f-display); font-weight: 700; font-size: .95rem; font-variant-numeric: tabular-nums; }
.pill b { color: var(--green-deep); }
.pill.time b { color: var(--violet); }
.pill.time.low b { color: var(--bad); animation: blink .5s steps(2) infinite; }
@keyframes blink { 50% { opacity: .35 } }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--violet); width: 100%; transition: width 1s linear; }
.bar.low i { background: var(--bad); }
.hint { font-size: .85rem; color: var(--muted); margin: 0; }

/* resultado */
.result { text-align: center; align-items: center; }
.stars { font-size: 2.6rem; letter-spacing: 6px; }
.stars span { display: inline-block; color: var(--line); }
.stars span.on { color: var(--gold); animation: star .5s cubic-bezier(.3,1.7,.5,1) both; }
.stars span.on:nth-child(2) { animation-delay: .2s } .stars span.on:nth-child(3) { animation-delay: .4s }
@keyframes star { 0% { transform: scale(0) rotate(-90deg) } 100% { transform: scale(1) rotate(0) } }
.cert { width: 100%; border: 2px dashed var(--green); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.cert b { font-family: var(--f-display); font-size: 1.1rem; }
.cert span { font-size: .88rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.left { text-align: left; width: 100%; }
.fixed .box { border-color: #5E8F62; }
.fixed .req { color: #C62828; }
.goodbtn { border: 0; background: #07B708; color: #FFFFFF; padding: 7px 14px; font-size: .88rem; border-radius: 4px; font-weight: 700; }
.goodmsg { background: #E2F6E2; color: #05600A; border: 1px solid #07B708; padding: 6px 8px; font-size: .82rem; border-radius: 4px; }
.gtable { width: 100%; border-collapse: collapse; font-size: .82rem; }
.gtable th, .gtable td { border: 1px solid #CFCFC7; padding: 4px 6px; text-align: left; }
.gtable th { background: #EFF6EE; }
.tablewrap { overflow-x: auto; }
/* dinámica extra */
.cd { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(3px); }
.cd span { font-family: var(--f-display); font-weight: 800; font-size: clamp(5rem, 28vw, 9rem); color: var(--violet); animation: cdpop .9s ease both; }
@keyframes cdpop { 0% { transform: scale(2.2); opacity: 0 } 30% { transform: scale(1); opacity: 1 } 100% { transform: scale(.6); opacity: 0 } }
.lens { position: fixed; z-index: 40; width: 74px; height: 74px; margin: -37px 0 0 -37px; border-radius: 50%; border: 4px solid var(--violet); box-shadow: 0 0 0 3px rgba(255,255,255,.7), 0 6px 16px rgba(0,0,0,.25); pointer-events: none; background: radial-gradient(circle, rgba(255,255,255,.08), rgba(91,43,196,.08)); }
.lens::after { content: ""; position: absolute; width: 30px; height: 7px; background: var(--violet); border-radius: 4px; right: -24px; bottom: -6px; transform: rotate(45deg); }
.ripple { position: fixed; z-index: 45; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; border: 3px solid var(--c, var(--violet)); pointer-events: none; animation: rip .55s ease-out forwards; }
@keyframes rip { to { transform: scale(5); opacity: 0 } }
.combo { position: fixed; left: 50%; top: 32%; z-index: 65; transform: translateX(-50%); font-family: var(--f-display); font-weight: 800; font-size: clamp(1.6rem, 8vw, 2.6rem); color: #FFFFFF; background: var(--violet); padding: 6px 22px; border-radius: 999px; box-shadow: 0 8px 20px rgba(0,0,0,.25); pointer-events: none; animation: combo 1s cubic-bezier(.3,1.6,.5,1) forwards; white-space: nowrap; }
@keyframes combo { 0% { transform: translateX(-50%) scale(.3) rotate(-8deg); opacity: 0 } 25% { transform: translateX(-50%) scale(1.1) rotate(3deg); opacity: 1 } 75% { opacity: 1 } 100% { transform: translateX(-50%) scale(1) translateY(-30px); opacity: 0 } }
.flash { position: fixed; inset: 0; z-index: 44; pointer-events: none; animation: flash .35s ease forwards; }
@keyframes flash { from { opacity: .35 } to { opacity: 0 } }
.icon-btn { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px; min-width: 40px; height: 34px; cursor: pointer; font-size: 1rem; }
.pill.pts b { color: var(--violet); }
.pts-pop { animation: ptspop .4s cubic-bezier(.3,1.7,.5,1); display: inline-block; }
@keyframes ptspop { 0% { transform: scale(1.6) } 100% { transform: scale(1) } }
.share { width: 100%; display: flex; flex-direction: column; gap: 10px; }
.share b { font-family: var(--f-display); }
.sgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.sbtn { font-family: var(--f-display); font-weight: 700; font-size: .95rem; border: 0; border-radius: 12px; padding: 12px 10px; min-height: 48px; cursor: pointer; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; }
.sbtn.wa { background: #1FA855; } .sbtn.fb { background: #1877F2; } .sbtn.x { background: #111111; } .sbtn.cp { background: var(--violet); } .sbtn.img { background: #E1306C; } .sbtn.nat { background: var(--green-deep); }
.sbtn svg { width: 20px; height: 20px; flex: none; }
.copied { font-size: .85rem; color: var(--ok); min-height: 1.2em; margin: 0; }
.big-score { font-family: var(--f-display); font-weight: 800; font-size: 2.4rem; color: var(--violet); line-height: 1; font-variant-numeric: tabular-nums; }
.big-score small { display: block; font-size: .85rem; color: var(--muted); font-weight: 600; }
canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 70; }
footer { text-align: center; font-size: .82rem; color: var(--muted); }
footer b { color: var(--ink); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.icon-btn { padding: 0 10px; font-family: var(--f-body); font-weight: 600; font-size: .85rem; }
.hudbtns { display: flex; gap: 6px; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(91,43,196,.5) } 50% { box-shadow: 0 0 0 6px rgba(91,43,196,0) } }
@keyframes shake { 0%,100% { transform: translateX(0) } 25%,75% { transform: translateX(-6px) } 50% { transform: translateX(6px) } }
.msg { margin: 0; border-radius: 10px; padding: 9px 12px; font-size: .92rem; animation: slide .3s ease; }
.msg.good { background: var(--ok-soft); }
.msg.warn { background: #FFF4D6; color: #5A4300; }
.msg.hint { background: var(--violet-soft); }
.badge-big { width: 120px; height: 120px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 2rem; color: var(--green-deep); background: var(--green-soft); border: 5px solid var(--green); animation: star .6s cubic-bezier(.3,1.7,.5,1) both; }
@keyframes slide { from { opacity: 0; transform: translateY(-6px) } to { opacity: 1; transform: none } }
/* Semana 7: laboratorio de migración con terminal oscura, hosting y BD */
:root { --term: #0D1B14; --term2: #13271C; --neon: #39FF7A; --cyan: #3DD9FF; --tline: #24402F; }
.mail { background: var(--violet-soft); border-radius: 12px; padding: 12px 14px; font-size: .95rem; }
.mail b { color: var(--violet); font-family: var(--f-display); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 600; background: var(--green-soft); color: var(--green-deep); border-radius: 999px; padding: 3px 10px 3px 3px; }
.chip b { width: 20px; height: 20px; border-radius: 50%; background: var(--green); color: #06260A; display: grid; place-items: center; font-size: .72rem; font-family: var(--f-display); }
.stepper { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.stepper::-webkit-scrollbar { display: none; }
.st { flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 600; color: var(--muted); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px 3px 3px; }
.st b { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--line); font-family: var(--f-display); font-size: .74rem; }
.st.cur { color: var(--ink); border-color: var(--violet); background: var(--violet-soft); }
.st.cur b { background: var(--violet); color: #FFF; animation: pulse 1.4s ease-in-out infinite; }
.st.ok { color: var(--ok); } .st.ok b { background: var(--ok); color: #FFF; }
.bar i { background: linear-gradient(90deg, var(--green), var(--cyan)); transition: width .6s ease; }

/* terminal / ventana */
.term { background: var(--term); color: #DDF7E6; border-radius: 16px; overflow: hidden; border: 1px solid var(--tline);
  box-shadow: 0 0 0 1px rgba(57,255,122,.08), 0 18px 40px -18px rgba(7,183,8,.55); position: relative; }
.term::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px); }
.term.in { animation: termin .45s cubic-bezier(.2,.9,.3,1.2); }
@keyframes termin { from { opacity: 0; transform: translateY(10px) scale(.98) } to { opacity: 1; transform: none } }
.term.nudge { animation: shake .35s ease; }
.th { background: var(--term2); padding: 10px 12px; font: 600 .84rem var(--f-display); display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--tline); flex-wrap: wrap; }
.dots { display: inline-flex; gap: 5px; } .dots i { width: 10px; height: 10px; border-radius: 50%; background: #FF5F57; } .dots i:nth-child(2) { background: #FEBC2E; } .dots i:nth-child(3) { background: #28C840; }
.srv { margin-left: auto; color: var(--neon); font-size: .74rem; font-weight: 600; animation: blink 1.6s steps(2) infinite; }
.tb { padding: 14px; display: flex; flex-direction: column; gap: 12px; position: relative; }
.small { font-size: .86rem; color: #A8C9B4; margin: 0; } .small.center { text-align: center; }
.term .btn { align-self: flex-start; }
.link { background: none; border: 0; color: var(--cyan); font: 600 .9rem var(--f-body); text-decoration: underline; cursor: pointer; padding: 6px 2px; align-self: center; }
.row2 { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.xls { display: flex; gap: 12px; align-items: center; background: rgba(255,255,255,.05); border: 1px solid var(--tline); border-radius: 12px; padding: 10px 12px; }
.xls span { display: block; font-size: .82rem; color: #A8C9B4; }
.xicon { flex: none; width: 46px; height: 52px; border-radius: 6px; background: #1D6F42; color: #FFF; display: grid; place-items: center; font: 800 1.4rem var(--f-display); box-shadow: inset -10px -10px 0 rgba(0,0,0,.12); animation: bob 2.4s ease-in-out infinite; }
.xicon.sm { width: 38px; height: 44px; font-size: 1.1rem; }
@keyframes bob { 50% { transform: translateY(-4px) } }
.tablewrap { overflow-x: auto; border-radius: 10px; border: 1px solid var(--tline); }
table.mini, table.grid-t { border-collapse: collapse; width: max-content; min-width: 100%; font-size: .78rem; }
.mini th, .mini td, .grid-t th, .grid-t td { border-bottom: 1px solid var(--tline); padding: 6px 8px; text-align: left; white-space: nowrap; }
.mini th, .grid-t th { background: #1D6F42; color: #FFF; font-family: var(--f-display); font-weight: 600; position: sticky; top: 0; }
.mini .fade { color: #7FA38C; text-align: center; font-style: italic; }
.grid-t td { padding: 0; } .grid-t td.rn { padding: 6px 8px; color: #7FA38C; }
.cell { font: .8rem ui-monospace, Consolas, monospace; background: transparent; border: 0; color: #DDF7E6; padding: 8px; width: 100%; min-width: 9ch; field-sizing: content; }
.cell:focus { outline: 2px solid var(--cyan); background: rgba(61,217,255,.08); }
.grid-t td.bad { background: rgba(255,90,90,.18); box-shadow: inset 0 0 0 2px #FF6B6B; animation: badpulse 1.2s ease-in-out infinite; }
.grid-t td.bad .cell { color: #FFC2C2; font-weight: 700; }
@keyframes badpulse { 50% { box-shadow: inset 0 0 0 2px #FF6B6B, 0 0 14px rgba(255,107,107,.6) } }
.vstat { font: 700 .9rem var(--f-display); } .vstat.no { color: #FF8A8A; } .vstat.yes { color: var(--neon); }

/* hosting */
.host .tools { display: flex; gap: 8px; flex-wrap: wrap; }
.tool { font: 600 .84rem var(--f-body); border: 1px solid var(--tline); background: rgba(255,255,255,.06); color: #DDF7E6; border-radius: 10px; padding: 9px 12px; min-height: 40px; cursor: pointer; }
.tool:hover { background: rgba(255,255,255,.12); }
.tool.done { border-color: var(--neon); color: var(--neon); }
.route { position: relative; display: flex; align-items: center; overflow-x: auto; scrollbar-width: none; padding: 26px 4px 6px; }
.route::-webkit-scrollbar { display: none; }
.rn { flex: none; max-width: 76px; text-align: center; overflow-wrap: anywhere; line-height: 1.15; display: flex; flex-direction: column; align-items: center; gap: 2px; font: 600 .62rem ui-monospace, Consolas, monospace; color: #7FA38C; transition: color .3s; }
.rn i { font-style: normal; font-size: 1.5rem; width: 46px; height: 46px; display: grid; place-items: center; border-radius: 12px; background: rgba(255,255,255,.05); border: 1px solid var(--tline); transition: .3s; }
.rn.on { color: var(--neon); } .rn.on i { border-color: var(--neon); box-shadow: 0 0 12px rgba(57,255,122,.45); }
.rn.ping i { transform: scale(1.18); border-color: var(--cyan); box-shadow: 0 0 18px rgba(61,217,255,.8); }
.rl { flex: 1 0 14px; height: 2px; margin: 0 4px 18px; background: var(--tline); position: relative; overflow: hidden; }
.rl b { position: absolute; inset: 0; background: linear-gradient(90deg, transparent, var(--cyan), transparent); animation: flow 1.4s linear infinite; }
@keyframes flow { from { transform: translateX(-100%) } to { transform: translateX(100%) } }
.trav { position: absolute; left: 0; top: 0; font-size: 1.4rem; opacity: 0; transition: transform .55s cubic-bezier(.4,1.6,.5,1), opacity .3s; pointer-events: none; filter: drop-shadow(0 0 6px rgba(61,217,255,.9)); }
.trav.show { opacity: 1; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: .82rem; }
.cr { background: none; border: 0; color: var(--cyan); cursor: pointer; font: 600 .82rem ui-monospace, Consolas, monospace; padding: 4px; }
.sep { color: #557A63; }
.pathline code { display: block; font: .82rem ui-monospace, Consolas, monospace; background: #07110C; border: 1px solid var(--tline); border-radius: 8px; padding: 8px 10px; color: var(--neon); overflow-wrap: anywhere; }
.pathline code::before { content: "usuario@hostescolar:~$ cd "; color: #6E9A7E; }
.pathline code.typing::after { content: "▌"; animation: blink .7s steps(2) infinite; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.item { display: flex; flex-direction: column; align-items: center; gap: 4px; background: rgba(255,255,255,.04); border: 1px solid var(--tline); color: #DDF7E6; border-radius: 12px; padding: 12px 6px; cursor: pointer; font: 600 .8rem ui-monospace, Consolas, monospace; overflow-wrap: anywhere; transition: transform .15s, background .15s; }
.item .ic { font-size: 1.8rem; }
.item:hover { background: rgba(57,255,122,.08); transform: translateY(-2px); }
.item.file { opacity: .75; }
.item.glow { border-color: var(--cyan); box-shadow: 0 0 0 2px var(--cyan), 0 0 22px rgba(61,217,255,.6); animation: bob 1s ease-in-out 3; }
.bkbar { display: flex; flex-direction: column; gap: 6px; font-size: .85rem; color: var(--neon); }
.drop { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; border: 2px dashed var(--cyan); border-radius: 16px; padding: 26px 14px; cursor: pointer; background: rgba(61,217,255,.05); transition: .2s; }
.drop span { font-size: .84rem; color: #A8C9B4; }
.drop .dz-ic { font-size: 2.2rem; color: var(--cyan); animation: bob 1.6s ease-in-out infinite; }
.drop.over { background: rgba(61,217,255,.16); transform: scale(1.02); box-shadow: 0 0 26px rgba(61,217,255,.5); }
.drop.locked { border-color: #557A63; background: rgba(255,255,255,.02); opacity: .65; }
.drop.locked .dz-ic { color: #557A63; animation: none; }
.drop.locked b::before { content: "🔒 "; }

/* migración */
.mig { display: grid; grid-template-columns: minmax(0,1fr) minmax(40px,1.2fr) minmax(0,1fr); align-items: center; gap: 6px; text-align: center; }
.src, .dbw { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: .84rem; min-width: 0; }
.recs { display: flex; flex-direction: column; gap: 3px; width: 100%; }
.rw { font: .66rem ui-monospace, Consolas, monospace; background: #1D6F42; border-radius: 4px; padding: 2px 4px; transition: transform .5s cubic-bezier(.5,0,.6,1), opacity .5s; overflow: hidden; text-overflow: ellipsis; }
.rw.fly { transform: translateX(170%) scale(.6); opacity: .9; background: var(--cyan); color: #04202A; }
.rw.gone { opacity: 0; }
.pipe { height: 10px; border-radius: 99px; background: #07110C; border: 1px solid var(--tline); overflow: hidden; position: relative; }
.pipe i { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, var(--cyan) 0 8px, transparent 8px 20px); animation: pipe .6s linear infinite; opacity: .8; }
@keyframes pipe { to { background-position: 20px 0 } }
.db { width: 64px; height: 76px; position: relative; display: grid; place-items: center; font: 800 1rem var(--f-display); color: #04202A;
  background: linear-gradient(180deg, var(--cyan), #1E9FCC); border-radius: 50% / 16%; box-shadow: 0 0 20px rgba(61,217,255,.45); }
.db::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 24%; border-radius: 50%; background: #8BEBFF; }
.db span { position: relative; }
.db.pulse { animation: dbp .4s ease; }
@keyframes dbp { 50% { transform: scale(1.12); box-shadow: 0 0 36px rgba(57,255,122,.9) } }
.cnt { font: 800 1.1rem var(--f-display); color: var(--neon); font-variant-numeric: tabular-nums; }
.bar.big { height: 12px; background: #07110C; }
.log { margin: 0; background: #050C08; color: var(--neon); border-radius: 10px; padding: 10px 12px; font: .74rem/1.5 ui-monospace, Consolas, monospace; height: 9.5em; overflow: auto; white-space: pre-wrap; border: 1px solid var(--tline); }

/* antes / después */
.cmp { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--tline); user-select: none; }
.cmp-after { position: absolute; inset: 0; }
.cmp-h { position: absolute; top: 0; bottom: 0; width: 3px; background: #FFF; transform: translateX(-50%); box-shadow: 0 0 12px rgba(255,255,255,.8); pointer-events: none; }
.cmp-h span { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 36px; height: 36px; border-radius: 50%; background: #FFF; color: #15211A; display: grid; place-items: center; font-weight: 800; }
.cmp .tag { position: absolute; top: 44px; font: 800 .7rem var(--f-display); padding: 2px 8px; border-radius: 6px; letter-spacing: .06em; }
.cmp .tag.l { left: 8px; background: #FF6B6B; color: #2A0A0A; } .cmp .tag.r { right: 8px; background: var(--neon); color: #06260A; }
.sys { background: #F4F6F5; color: #1E2A22; min-height: 300px; font-size: .8rem; }
.sys.before { filter: grayscale(.9); }
.sbar { display: flex; justify-content: space-between; padding: 9px 12px; background: #2B3A31; color: #FFF; font-size: .78rem; }
.sys.after .sbar { background: #057A0A; }
.sbody { padding: 10px; display: flex; flex-direction: column; gap: 10px; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; }
.kpis div { background: #FFF; border-radius: 8px; padding: 6px; text-align: center; border: 1px solid #DDE5DF; min-width: 0; }
.kpis b { display: block; font: 800 1.05rem var(--f-display); color: #057A0A; overflow: hidden; text-overflow: ellipsis; }
.kpis span { font-size: .68rem; color: #5A6B5E; }
.st-t { width: 100%; border-collapse: collapse; background: #FFF; font-size: .7rem; table-layout: fixed; }
.st-t th, .st-t td { border-bottom: 1px solid #E3EAE5; padding: 5px 6px; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-t th { background: #E2F6E2; }
.empty { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; padding: 26px 10px; color: #5A6B5E; }
.empty span { font-size: 2.4rem; }
input[type=range] { width: 100%; accent-color: var(--neon); height: 28px; }
.qin { flex: 1 1 180px; min-width: 0; font: .95rem ui-monospace, Consolas, monospace; padding: 12px; border-radius: 12px; border: 1.5px solid var(--tline); background: #07110C; color: var(--neon); }
.qin:focus { outline: 2px solid var(--cyan); }
.ficha { display: flex; gap: 12px; align-items: flex-start; background: #F4F6F5; color: #1E2A22; border-radius: 14px; padding: 14px; animation: termin .5s cubic-bezier(.2,.9,.3,1.3); }
.ficha .av { flex: none; width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, var(--green), var(--cyan)); color: #FFF; display: grid; place-items: center; font: 800 1.1rem var(--f-display); }
.ficha div:last-child { display: flex; flex-direction: column; gap: 2px; min-width: 0; font-size: .84rem; overflow-wrap: anywhere; }
.ficha b { font-family: var(--f-display); font-size: 1rem; }
.console { border: 0; background: none; padding: 0; min-height: 0; }
.msg.info { background: var(--surface); border: 1px solid var(--line); }
.result .lead b { color: var(--ink); }
.bkbar[hidden] { display: none; }

const app = document.getElementById("app");
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (ms) => { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };

function start() {
  app.innerHTML = `<section class="panel">
    <p class="rec-note">🎮 Actividad recreativa: practica sin presión. Si te equivocas, el sistema te explica qué pasó.</p>
    <h2>Migra a los alumnos de Uruapan al nuevo sistema</h2>

    <div class="chips">${STEPS.map((s, i) => `<span class="chip"><b>${i + 1}</b>${s.t}</span>`).join("")}</div>
    <label for="nm">Tu nombre</label>
    <input id="nm" type="text" maxlength="40" autocomplete="name" placeholder="Escribe tu nombre">
    <button class="btn" id="go" disabled>Entrar al laboratorio</button></section>`;
  const nm = $("#nm"), go = $("#go");
  nm.value = S.name; go.disabled = !nm.value.trim();
  nm.addEventListener("input", () => (go.disabled = !nm.value.trim()));
  nm.addEventListener("keydown", (e) => { if (e.key === "Enter" && nm.value.trim()) go.click(); });
  go.addEventListener("click", () => { S.name = nm.value.trim(); lab(); });
}

function lab() {
  Object.assign(S, { step: 0, t0: Date.now(), slips: 0, path: "/", backup: false, rows: null, migrated: false, slid: false, done: false });
  clearInterval(S.tick);
  app.innerHTML = `
  <div class="hud">
    <div class="hudrow"><span class="pill">Avance <b id="pct">0%</b></span><span class="pill time">⏱ <b id="clk">0:00</b></span>
      <span class="hudbtns"><button class="icon-btn" id="hint">💡 Pista</button><button class="icon-btn" id="snd" aria-label="Sonido">${S.sound ? "🔊" : "🔇"}</button></span></div>
    <div class="bar"><i id="bari" style="width:0%"></i></div>
    <div class="stepper" id="stepper"></div>
  </div>
  <section class="term" id="stage"></section>
  <div class="console" id="console" aria-live="polite"></div>`;
  S.tick = setInterval(() => { const c = $("#clk"); if (c) c.textContent = fmt(Date.now() - S.t0); }, 500);
  $("#snd").addEventListener("click", () => { S.sound = !S.sound; $("#snd").textContent = S.sound ? "🔊" : "🔇"; });
  $("#hint").addEventListener("click", () => say("hint", "💡 Pista: " + STEPS[Math.min(S.step, STEPS.length - 1)].hint));

function demoPath() {

function backup() {

function dropZone() {
  return `<label class="drop ${S.step < 3 ? "locked" : ""}" id="drop" for="file">

function bindDrop() {
  const d = $("#drop"), f = $("#file");
  const guard = (e) => { if (S.step < 3) { e.preventDefault(); slip("En producción <b>nunca se migra sin respaldo</b>. Presiona primero “Respaldar base de datos”."); return true; } return false; };

function readFile(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      let rows;
      if (/\.csv$/i.test(file.name) || !window.XLSX) {
        rows = new TextDecoder().decode(r.result).replace(/^﻿/, "").split(/\r?\n/).filter(Boolean).map((l) => l.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map((c) => c.replace(/^"|"$/g, "")));
      } else {
        const wb = XLSX.read(r.result, { type: "array" });
        rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: "" });
      }
      const head = (rows[0] || []).map((h) => String(h).trim().toLowerCase());
      if (head[0] !== "matricula") { slip("Ese archivo no tiene la columna <b>Matricula</b>. Sube el Excel que descargaste en el paso 1 o usa el archivo de prueba."); return; }
      loadRows(rows.slice(1).filter((x) => x.some((c) => String(c).trim())).map((x) => COLS.map((_, j) => String(x[j] ?? "").trim())), file.name);
    } catch (e) { slip("No se pudo leer el archivo. Sube el Excel del paso 1 o usa el archivo de prueba."); }
  };
  r.readAsArrayBuffer(file);
}
function loadRows(rows, name) {

  S.rows = rows; sOk();
  advance(`✓ ${esc(name)} cargado con ${rows.length} registros. Antes de migrar, el sistema revisará los datos.`);
}

/* 5. Validar */
function problems() {
  const seen = {}, bad = [];
  S.rows.forEach((r, i) => {
    const m = String(r[0]);
    if (!/^\d{10}$/.test(m)) bad.push([i, 0, `La matrícula de <b>${esc(r[1] || "fila " + (i + 1))}</b> tiene ${m.replace(/\D/g, "").length} dígitos; debe tener 10.`]);
    else if (seen[m]) bad.push([i, 0, `La matrícula ${m} está repetida.`]);
    seen[m] = 1;
    if (!/^\d{3} ?\d{3} ?\d{4}$/.test(String(r[3]))) bad.push([i, 3, `El teléfono de <b>${esc(r[1])}</b> debe tener 10 dígitos.`]);
  });
  return bad;
}
function stepValidate() {
  const bad = problems();
  const badSet = new Set(bad.map(([i, j]) => i + ":" + j));

    </table></div>

  </div>`;
  document.querySelectorAll(".cell").forEach((c) => c.addEventListener("input", () => { S.rows[+c.dataset.i][+c.dataset.j] = c.value.trim(); }));
  $("#val").addEventListener("click", () => {

}

        <button class="sbtn img" id="sh-img">🖼️ Imagen para historias</button>
      </div>
      <p class="copied" id="copied" aria-live="polite"></p>
    </div>
    <p class="lead" style="font-size:.92rem">💬 Comparte en el chat de la clase tu tiempo.</p>
    <button class="btn" id="again">Repetir el laboratorio</button></section>`;
  $("#again").addEventListener("click", lab);
  setupShare(fmt(ms), 3);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function countdown(done) {
  const o = document.createElement("div"); o.className = "cd"; document.body.appendChild(o);
  const seq = ["3", "2", "1", "¡Ya!"]; let i = 0;
  const step = () => {
    if (i >= seq.length) { o.remove(); done(); return; }
    o.innerHTML = `<span>${seq[i]}</span>`; beep(i < 3 ? 520 : 880, i < 3 ? .12 : .25, "square", .06); i++;
    setTimeout(step, reduce ? 300 : 800);
  };
  step();
}

/* sonido (se activa después de tocar un botón) */
let AC = null;
function beep(f, d, type = "sine", vol = .08, when = 0) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + when;
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .02);
  } catch (e) {}
}
const sOk = () => { beep(660, .12, "triangle", .1); beep(990, .18, "triangle", .1, .09); };
const sCombo = () => { [660, 830, 990, 1320].forEach((f, i) => beep(f, .14, "triangle", .09, i * .07)); };
const sBad = () => { beep(160, .25, "sawtooth", .07); };
const sTick = () => beep(1200, .04, "square", .03);
const sWin = () => { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => beep(f, .2, "triangle", .1, i * .12)); };
const sLose = () => { [392, 330, 262].forEach((f, i) => beep(f, .28, "sine", .09, i * .2)); };
function ripple(x, y, c) {
  const r = document.createElement("div"); r.className = "ripple"; r.style.left = x + "px"; r.style.top = y + "px";
  if (c) r.style.setProperty("--c", c); document.body.appendChild(r); setTimeout(() => r.remove(), 600);
}
function flash(c) { if (reduce) return; const f = document.createElement("div"); f.className = "flash"; f.style.background = c; document.body.appendChild(f); setTimeout(() => f.remove(), 400); }
function setPts(add) { S.pts = Math.max(0, S.pts + add); const b = $("#pts"); if (!b) return; b.textContent = S.pts; b.classList.remove("pts-pop"); void b.offsetWidth; b.classList.add("pts-pop"); }
function floatText(t, x, y, cls) {
  const f = document.createElement("div"); f.className = "float " + cls; f.textContent = t;
  f.style.left = x + "px"; f.style.top = y + "px"; document.body.appendChild(f);

}

/* efectos */
const cv = document.getElementById("fx"), ctx = cv.getContext("2d");
let parts = [], raf = 0;
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function size() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
addEventListener("resize", size); size();
const COLORS = ["#07B708", "#F2B400", "#5B2BC4", "#D6338A", "#2E7DD7", "#F07B00"];
function burst(x, y, n) {
  if (reduce) return;
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 4;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, g: .18, life: 40 + Math.random() * 20, c: COLORS[i % COLORS.length], r: 3 + Math.random() * 3, rot: 0, vr: 0 }); }
  loop();
}
function confetti() {
  if (reduce) return;
  for (let i = 0; i < 160; i++) parts.push({ x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * .5, vx: (Math.random() - .5) * 2, vy: 2 + Math.random() * 3, g: .05, life: 220, c: COLORS[i % COLORS.length], r: 4 + Math.random() * 4, rot: Math.random() * 6, vr: (Math.random() - .5) * .3, rect: true });
  loop();
}
function loop() {
  if (raf) return;
  const step = () => {
    const d = devicePixelRatio; ctx.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter((p) => p.life > 0 && p.y < innerHeight + 40);
    for (const p of parts) {
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
      ctx.save(); ctx.translate(p.x * d, p.y * d); ctx.rotate(p.rot); ctx.fillStyle = p.c; ctx.globalAlpha = Math.min(1, p.life / 30);
      if (p.rect) ctx.fillRect(-p.r * d, -p.r * d / 2, p.r * 2 * d, p.r * d); else { ctx.beginPath(); ctx.arc(0, 0, p.r * d, 0, 7); ctx.fill(); }
      ctx.restore();
    }
    if (parts.length) raf = requestAnimationFrame(step); else { raf = 0; ctx.clearRect(0, 0, cv.width, cv.height); }
  };
  raf = requestAnimationFrame(step);
}



/* compartir */
function gameUrl() { return location.protocol.startsWith("http") ? location.href.split("#")[0] : ""; }
function shareText(n) {
  const u = gameUrl();
  return `🚀 Completé el "Laboratorio de Migración" en ${n}: migré los alumnos del Excel al sistema escolar sin perder datos. ¿Lo logras más rápido?` + (u ? " " + u : "") + " #UTEL #AnálisisYDiseño";
}
function setupShare(n, stars) {
  const txt = shareText(n), u = gameUrl(), enc = encodeURIComponent;
  $("#sh-wa").href = "https://wa.me/?text=" + enc(txt);
  $("#sh-x").href = "https://twitter.com/intent/tweet?text=" + enc(txt);
  const fb = $("#sh-fb");
  if (u) fb.href = "https://www.facebook.com/sharer/sharer.php?u=" + enc(u); else fb.hidden = true;
  if (navigator.share) {
    const nat = $("#sh-nat"); nat.hidden = false;
    nat.addEventListener("click", async () => {
      try {
        const blob = await cardBlob(n, stars), file = blob && new File([blob], "laboratorio-migracion.png", { type: "image/png" });
        if (file && navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], text: txt });
        else await navigator.share({ text: txt, url: u || undefined });
      } catch (e) {}
    });
  }
  $("#sh-cp").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(txt); $("#copied").textContent = "Mensaje copiado. Pégalo en tu red social favorita."; }
    catch (e) { $("#copied").textContent = txt; }
  });
  $("#sh-img").addEventListener("click", async () => {
    const blob = await cardBlob(n, stars); if (!blob) return;
    const file = new File([blob], "laboratorio-migracion.png", { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], text: txt }); return; } catch (e) {} }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "laboratorio-migracion.png";
    document.body.appendChild(a); a.click(); a.remove();
    $("#copied").textContent = "Imagen descargada. Súbela a tus historias.";
  });
}
function cardBlob(n, stars) {
  return new Promise((res) => {
    const W = 1080, H = 1350, c = document.createElement("canvas"); c.width = W; c.height = H; const g = c.getContext("2d");
    const grd = g.createLinearGradient(0, 0, W, H); grd.addColorStop(0, "#5B2BC4"); grd.addColorStop(1, "#07B708");
    g.fillStyle = grd; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 60; i++) { g.fillStyle = ["#F2B400", "#FFFFFF", "#D6338A", "#2E7DD7"][i % 4]; g.globalAlpha = .35; g.fillRect(Math.random() * W, Math.random() * H, 14, 7); }
    g.globalAlpha = 1;
    g.fillStyle = "#FFFFFF"; roundRect(g, 70, 150, W - 140, H - 300, 48); g.fill();
    const draw = () => {
      g.textAlign = "center"; g.fillStyle = "#057A0A"; g.font = "800 66px Poppins, Arial, sans-serif"; g.fillText("Laboratorio de Migración", W / 2, 405);
      g.fillStyle = "#5B2BC4"; g.font = "700 40px Poppins, Arial, sans-serif"; g.fillText("Semana 7 · Implementación", W / 2, 468);
      g.font = "130px Arial, sans-serif"; g.fillText("🚀", W / 2, 630);
      g.fillStyle = "#15211A"; g.font = "800 150px Poppins, Arial, sans-serif"; g.fillText(n, W / 2, 805);
      g.font = "600 44px 'Work Sans', Arial, sans-serif"; g.fillStyle = "#5A6B5E"; g.fillText("5 de 5 alumnos migrados · 100%", W / 2, 868);
      g.fillStyle = "#15211A"; g.font = "700 56px Poppins, Arial, sans-serif"; g.fillText(S.name.slice(0, 28), W / 2, 960);
      g.fillStyle = "#5B2BC4"; g.font = "700 48px Poppins, Arial, sans-serif"; g.fillText("¿Lo logras más rápido? ⚡", W / 2, 1050);
      g.fillStyle = "#5A6B5E"; g.font = "500 32px 'Work Sans', Arial, sans-serif"; g.fillText("Docente: Dr. Armando Maravilla · Actividad recreativa", W / 2, 1120);
      g.fillStyle = "#FFFFFF"; g.font = "700 38px Poppins, Arial, sans-serif"; g.fillText("Análisis y diseño de sistemas", W / 2, H - 80);
      c.toBlob((b) => res(b), "image/png");
    };
    const logo = new Image(); logo.onload = () => { const lw = 260, lh = lw * logo.height / logo.width; g.drawImage(logo, W / 2 - lw / 2, 180, lw, lh); draw(); }; logo.onerror = draw;
    logo.src = document.querySelector(".logo").src;
  });
}
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
